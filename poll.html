<div id="adminSessionPanel" class="hidden">

  <!-- SESSION SETTINGS -->
  <div class="admin-section">
    <h3>Session Settings</h3>

    <label class="field-label">
      Name
    </label>

    <input
      id="editSessionName"
      class="input"
      placeholder="Session name"
    />

    <label
      class="field-label"
      style="margin-top:10px;"
    >
      Code
    </label>

    <input
      id="editSessionCode"
      class="input"
      placeholder="Session code"
    />
  </div>


  <!-- PEOPLE -->
  <div class="admin-section">
    <h3>People</h3>

    <div class="person-form">
      <input
        id="newPersonName"
        class="input"
        placeholder="Name"
      />

      <button
        id="addPerson"
        class="btn secondary"
      >
        Add Person
      </button>
    </div>

    <div
      id="peopleList"
      class="admin-list"
    ></div>
  </div>


  <!-- SESSION ACTIONS -->
  <div style="margin-top:16px;">

    <button
      id="saveSession"
      class="btn primary"
      style="width:100%;"
    >
      Save Session
    </button>

    <button
      id="deleteSession"
      class="btn danger"
      style="
        width:100%;
        margin-top:10px;
      "
    >
      Delete Session
    </button>

  </div>

</div>
