<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Receipt OCR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #f3f4f6;
            color: #1f2937;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            padding: 24px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .description {
            margin-top: 0;
            margin-bottom: 24px;
            color: #6b7280;
            line-height: 1.5;
        }

        .upload-label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .hidden-file-input {
            display: none;
        }

        .upload-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-button {
            min-height: 52px;
            border: 1px solid #bfdbfe;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .upload-button:hover {
            background: #dbeafe;
        }

        .image-section {
            display: none;
            margin-top: 22px;
        }

        .image-section h2,
        .result-container h2 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .preview-panel {
            min-width: 0;
        }

        .preview-panel h3 {
            margin: 0 0 8px;
            color: #4b5563;
            font-size: 15px;
        }

        #imagePreview,
        #processedCanvas {
            display: block;
            width: 100%;
            max-height: 550px;
            object-fit: contain;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #f9fafb;
        }

        #processedPanel {
            display: none;
        }

        #processingNote {
            display: none;
            margin: 10px 0 0;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.4;
        }

        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        #scanButton {
            flex: 1;
            background: #2563eb;
            color: white;
        }

        #scanButton:hover {
            background: #1d4ed8;
        }

        #scanButton:disabled,
        .upload-button:disabled {
            background: #9ca3af;
            border-color: #9ca3af;
            color: white;
            cursor: not-allowed;
        }

        #clearButton {
            background: #e5e7eb;
            color: #1f2937;
        }

        #clearButton:hover {
            background: #d1d5db;
        }

        .status-container {
            display: none;
            margin-top: 20px;
        }

        #statusText {
            margin-bottom: 8px;
            font-weight: bold;
        }

        .progress-background {
            width: 100%;
            height: 16px;
            overflow: hidden;
            background: #e5e7eb;
            border-radius: 999px;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #2563eb;
            transition: width 0.2s ease;
        }

        .result-container {
            display: none;
            margin-top: 24px;
        }

        .result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        #confidenceText {
            color: #6b7280;
            font-size: 14px;
        }

        #recognizedText {
            width: 100%;
            min-height: 300px;
            padding: 14px;
            resize: vertical;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-family: Consolas, Monaco, monospace;
            font-size: 15px;
            line-height: 1.5;
        }

        #errorMessage {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border: 1px solid #fecaca;
            border-radius: 8px;
            background: #fef2f2;
            color: #991b1b;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 18px;
            }

            .upload-options,
            .preview-grid {
                grid-template-columns: 1fr;
            }

            .button-row {
                flex-direction: column;
            }

            .result-header {
                display: block;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card">
            <h1>Receipt OCR</h1>

            <p class="description">
                Take a new picture or choose an existing receipt image.
                The page will crop, perspective-correct, rotate, and clean
                the receipt before scanning its text.
            </p>

            <span class="upload-label">Select receipt image</span>

            <div class="upload-options">
                <button id="cameraButton" class="upload-button" type="button">
                    📷 Take Photo
                </button>

                <button id="galleryButton" class="upload-button" type="button">
                    🖼 Choose Existing Photo
                </button>
            </div>

            <input
                type="file"
                id="cameraInput"
                class="hidden-file-input"
                accept="image/*"
                capture="environment"
            >

            <input
                type="file"
                id="galleryInput"
                class="hidden-file-input"
                accept="image/*"
            >

            <div id="imageSection" class="image-section">
                <h2>Receipt preview</h2>

                <div class="preview-grid">
                    <div class="preview-panel">
                        <h3>Original</h3>

                        <img
                            id="imagePreview"
                            alt="Selected receipt preview"
                        >
                    </div>

                    <div id="processedPanel" class="preview-panel">
                        <h3>Processed for OCR</h3>

                        <canvas id="processedCanvas"></canvas>
                    </div>
                </div>

                <p id="processingNote"></p>
            </div>

            <!-- Hidden canvas used to resize the original image. -->
            <canvas id="sourceCanvas" hidden></canvas>

            <div class="button-row">
                <button id="scanButton" type="button" disabled>
                    Process and Scan Receipt
                </button>

                <button id="clearButton" type="button">
                    Clear
                </button>
            </div>

            <div id="statusContainer" class="status-container">
                <div id="statusText">Preparing image...</div>

                <div class="progress-background">
                    <div id="progressBar"></div>
                </div>
            </div>

            <div id="errorMessage"></div>

            <div id="resultContainer" class="result-container">
                <div class="result-header">
                    <h2>Recognized text</h2>
                    <span id="confidenceText"></span>
                </div>

                <textarea
                    id="recognizedText"
                    placeholder="Recognized text will appear here..."
                ></textarea>
            </div>
        </section>
    </main>

    <!-- Tesseract.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js">
    </script>

    <!-- OpenCV.js for receipt detection and perspective correction -->
    <script
        async
        src="https://docs.opencv.org/4.x/opencv.js">
    </script>

    <script>
        const cameraButton =
            document.getElementById("cameraButton");

        const galleryButton =
            document.getElementById("galleryButton");

        const cameraInput =
            document.getElementById("cameraInput");

        const galleryInput =
            document.getElementById("galleryInput");

        const imageSection =
            document.getElementById("imageSection");

        const imagePreview =
            document.getElementById("imagePreview");

        const sourceCanvas =
            document.getElementById("sourceCanvas");

        const processedCanvas =
            document.getElementById("processedCanvas");

        const processedPanel =
            document.getElementById("processedPanel");

        const processingNote =
            document.getElementById("processingNote");

        const scanButton =
            document.getElementById("scanButton");

        const clearButton =
            document.getElementById("clearButton");

        const statusContainer =
            document.getElementById("statusContainer");

        const statusText =
            document.getElementById("statusText");

        const progressBar =
            document.getElementById("progressBar");

        const resultContainer =
            document.getElementById("resultContainer");

        const recognizedText =
            document.getElementById("recognizedText");

        const confidenceText =
            document.getElementById("confidenceText");

        const errorMessage =
            document.getElementById("errorMessage");

        let selectedFile = null;
        let previewUrl = null;
        let worker = null;

        cameraButton.addEventListener("click", () => {
            cameraInput.click();
        });

        galleryButton.addEventListener("click", () => {
            galleryInput.click();
        });

        cameraInput.addEventListener("change", handleImageSelection);
        galleryInput.addEventListener("change", handleImageSelection);
        scanButton.addEventListener("click", scanReceipt);
        clearButton.addEventListener("click", clearPage);

        function handleImageSelection(event) {
            const file = event.target.files[0];

            clearError();
            resetResults();
            clearProcessedPreview();

            if (!file) {
                return;
            }

            if (!file.type.startsWith("image/")) {
                showError("Please select a valid image file.");
                event.target.value = "";
                return;
            }

            selectedFile = file;

            /*
                Clear the other input so selecting the same image again
                will still trigger its change event.
            */
            if (event.target === cameraInput) {
                galleryInput.value = "";
            } else {
                cameraInput.value = "";
            }

            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
            }

            previewUrl = URL.createObjectURL(file);
            imagePreview.src = previewUrl;

            imageSection.style.display = "block";
            scanButton.disabled = false;
        }

        async function scanReceipt() {
            if (!selectedFile) {
                showError("Please select a receipt image first.");
                return;
            }

            clearError();
            resetResults();
            setControlsDisabled(true);

            statusContainer.style.display = "block";
            statusText.textContent = "Loading image tools...";
            progressBar.style.width = "5%";

            try {
                await waitForOpenCv();

                statusText.textContent =
                    "Detecting and straightening receipt...";

                progressBar.style.width = "12%";

                const preprocessingResult =
                    await preprocessReceipt(selectedFile);

                const rotationMessage =
                    Math.abs(preprocessingResult.rotationAngle) >= 0.2
                        ? ` Text alignment detected; rotated ${preprocessingResult.rotationAngle.toFixed(1)}° before OCR.`
                        : " Text lines were already close to horizontal.";

                processingNote.textContent =
                    (preprocessingResult.receiptDetected
                        ? "Receipt edges were detected and perspective correction was applied."
                        : "Receipt edges were not confidently detected, so the full image was used.")
                    + rotationMessage;

                processingNote.style.display = "block";
                processedPanel.style.display = "block";

                if (!worker) {
                    statusText.textContent = "Loading OCR engine...";

                    worker = await Tesseract.createWorker("eng", 1, {
                        logger: updateOcrProgress
                    });

                    await worker.setParameters({
                        tessedit_pageseg_mode: "6",
                        preserve_interword_spaces: "1",
                        user_defined_dpi: "300"
                    });
                }

                statusText.textContent =
                    "Testing several text rotations...";

                /*
                    The automatic deskew may still leave a small residual
                    angle. Test nearby rotations and keep the OCR result
                    with the highest confidence score.
                */
                const sweepResult = await recognizeBestRotation(
                    processedCanvas,
                    [-15, -10, -5, 0, 5, 10, 15]
                );

                /*
                    Replace the preview with the exact rotation that won,
                    so the displayed image matches what Tesseract used.
                */
                copyCanvas(
                    sweepResult.canvas,
                    processedCanvas
                );

                const text = sweepResult.result.data.text.trim();

                const confidence = Math.round(
                    sweepResult.result.data.confidence || 0
                );

                recognizedText.value =
                    text || "No readable text was found.";

                confidenceText.textContent =
                    `OCR confidence: ${confidence}% | Best extra rotation: ${sweepResult.angle > 0 ? "+" : ""}${sweepResult.angle}°`;

                processingNote.textContent +=
                    ` Tesseract tested rotations from -15° to +15° and selected ${sweepResult.angle > 0 ? "+" : ""}${sweepResult.angle}° with the highest confidence.`;

                resultContainer.style.display = "block";

                statusText.textContent = "OCR complete";
                progressBar.style.width = "100%";
            } catch (error) {
                console.error("Receipt scan error:", error);

                showError(
                    "The receipt could not be processed. " +
                    "Try a clearer image with the complete receipt visible."
                );

                statusContainer.style.display = "none";
            } finally {
                setControlsDisabled(false);
            }
        }


        async function recognizeBestRotation(sourceCanvas, angles) {
            let best = null;

            for (let index = 0; index < angles.length; index++) {
                const angle = angles[index];

                statusText.textContent =
                    `Testing rotation ${index + 1} of ${angles.length}: ${angle > 0 ? "+" : ""}${angle}°`;

                const baseProgress = 15;
                const sweepProgress = 80;
                const completedFraction = index / angles.length;

                progressBar.style.width =
                    `${baseProgress + Math.round(completedFraction * sweepProgress)}%`;

                const rotatedCanvas = rotateCanvasExpanded(
                    sourceCanvas,
                    angle
                );

                const result = await worker.recognize(rotatedCanvas);
                const confidence = Number(result.data.confidence || 0);

                console.log(
                    `Rotation ${angle}° confidence:`,
                    confidence
                );

                if (!best || confidence > best.confidence) {
                    if (best && best.canvas) {
                        best.canvas.width = 0;
                        best.canvas.height = 0;
                    }

                    best = {
                        angle,
                        confidence,
                        result,
                        canvas: rotatedCanvas
                    };
                } else {
                    rotatedCanvas.width = 0;
                    rotatedCanvas.height = 0;
                }
            }

            if (!best) {
                throw new Error("No OCR rotation produced a result.");
            }

            return best;
        }

        function rotateCanvasExpanded(sourceCanvas, angleDegrees) {
            const angleRadians = angleDegrees * Math.PI / 180;
            const cosine = Math.abs(Math.cos(angleRadians));
            const sine = Math.abs(Math.sin(angleRadians));

            const outputWidth = Math.ceil(
                sourceCanvas.width * cosine +
                sourceCanvas.height * sine
            );

            const outputHeight = Math.ceil(
                sourceCanvas.width * sine +
                sourceCanvas.height * cosine
            );

            const outputCanvas = document.createElement("canvas");
            outputCanvas.width = outputWidth;
            outputCanvas.height = outputHeight;

            const context = outputCanvas.getContext("2d", {
                willReadFrequently: true
            });

            context.fillStyle = "white";
            context.fillRect(0, 0, outputWidth, outputHeight);

            context.translate(outputWidth / 2, outputHeight / 2);
            context.rotate(angleRadians);
            context.drawImage(
                sourceCanvas,
                -sourceCanvas.width / 2,
                -sourceCanvas.height / 2
            );

            return outputCanvas;
        }

        function copyCanvas(sourceCanvas, destinationCanvas) {
            destinationCanvas.width = sourceCanvas.width;
            destinationCanvas.height = sourceCanvas.height;

            const context = destinationCanvas.getContext("2d", {
                willReadFrequently: true
            });

            context.clearRect(
                0,
                0,
                destinationCanvas.width,
                destinationCanvas.height
            );

            context.drawImage(sourceCanvas, 0, 0);
        }

        function waitForOpenCv(timeoutMilliseconds = 20000) {
            return new Promise((resolve, reject) => {
                const startTime = Date.now();

                const checkOpenCv = () => {
                    if (
                        typeof cv !== "undefined" &&
                        cv.Mat
                    ) {
                        resolve();
                        return;
                    }

                    if (
                        Date.now() - startTime >
                        timeoutMilliseconds
                    ) {
                        reject(
                            new Error("OpenCV.js failed to load.")
                        );

                        return;
                    }

                    setTimeout(checkOpenCv, 100);
                };

                checkOpenCv();
            });
        }

        async function preprocessReceipt(file) {
            const image = await loadImage(file);

            /*
                Large phone photos use a lot of memory in OpenCV.
                Resize while preserving enough detail for small receipt text.
            */
            const maximumDimension = 2200;

            const scale = Math.min(
                1,
                maximumDimension /
                    Math.max(image.naturalWidth, image.naturalHeight)
            );

            const sourceWidth =
                Math.round(image.naturalWidth * scale);

            const sourceHeight =
                Math.round(image.naturalHeight * scale);

            sourceCanvas.width = sourceWidth;
            sourceCanvas.height = sourceHeight;

            const sourceContext =
                sourceCanvas.getContext("2d", {
                    willReadFrequently: true
                });

            sourceContext.clearRect(
                0,
                0,
                sourceWidth,
                sourceHeight
            );

            sourceContext.drawImage(
                image,
                0,
                0,
                sourceWidth,
                sourceHeight
            );

            let source = null;
            let gray = null;
            let blurred = null;
            let edges = null;
            let kernel = null;
            let contours = null;
            let hierarchy = null;
            let warped = null;
            let cleaned = null;

            try {
                source = cv.imread(sourceCanvas);
                gray = new cv.Mat();
                blurred = new cv.Mat();
                edges = new cv.Mat();

                cv.cvtColor(
                    source,
                    gray,
                    cv.COLOR_RGBA2GRAY
                );

                cv.GaussianBlur(
                    gray,
                    blurred,
                    new cv.Size(5, 5),
                    0,
                    0,
                    cv.BORDER_DEFAULT
                );

                cv.Canny(
                    blurred,
                    edges,
                    50,
                    150
                );

                kernel = cv.getStructuringElement(
                    cv.MORPH_RECT,
                    new cv.Size(5, 5)
                );

                cv.morphologyEx(
                    edges,
                    edges,
                    cv.MORPH_CLOSE,
                    kernel
                );

                contours = new cv.MatVector();
                hierarchy = new cv.Mat();

                cv.findContours(
                    edges,
                    contours,
                    hierarchy,
                    cv.RETR_LIST,
                    cv.CHAIN_APPROX_SIMPLE
                );

                const receiptCorners =
                    findLargestReceiptQuadrilateral(
                        contours,
                        source.cols * source.rows
                    );

                let receiptDetected = false;

                if (receiptCorners) {
                    warped = warpReceipt(
                        source,
                        receiptCorners
                    );

                    receiptDetected = true;
                } else {
                    warped = source.clone();
                }

                const deskewResult = autoDeskewReceipt(warped);
                deskewed = deskewResult.image;

                cleaned = cleanReceiptForOcr(deskewed);

                cv.imshow(processedCanvas, cleaned);

                return {
                    receiptDetected,
                    rotationAngle: deskewResult.rotationAngle
                };
            } finally {
                [
                    source,
                    gray,
                    blurred,
                    edges,
                    kernel,
                    contours,
                    hierarchy,
                    warped,
                    deskewed,
                    cleaned
                ].forEach((matrix) => {
                    if (matrix) {
                        matrix.delete();
                    }
                });
            }
        }

        function findLargestReceiptQuadrilateral(
            contours,
            imageArea
        ) {
            let bestCorners = null;
            let bestArea = 0;

            /*
                Ignore tiny rectangles such as logos and text boxes.
                The detected receipt should cover at least 15% of the image.
            */
            const minimumArea = imageArea * 0.15;

            for (
                let index = 0;
                index < contours.size();
                index++
            ) {
                const contour = contours.get(index);
                const perimeter = cv.arcLength(contour, true);
                const approximation = new cv.Mat();

                cv.approxPolyDP(
                    contour,
                    approximation,
                    0.02 * perimeter,
                    true
                );

                const area = Math.abs(
                    cv.contourArea(approximation)
                );

                if (
                    approximation.rows === 4 &&
                    area > minimumArea &&
                    area > bestArea &&
                    cv.isContourConvex(approximation)
                ) {
                    const points = [];

                    for (
                        let pointIndex = 0;
                        pointIndex < 4;
                        pointIndex++
                    ) {
                        points.push({
                            x: approximation.intPtr(
                                pointIndex,
                                0
                            )[0],

                            y: approximation.intPtr(
                                pointIndex,
                                0
                            )[1]
                        });
                    }

                    bestCorners = orderCorners(points);
                    bestArea = area;
                }

                approximation.delete();
                contour.delete();
            }

            return bestCorners;
        }

        function orderCorners(points) {
            /*
                Return corners in this order:
                top-left, top-right, bottom-right, bottom-left.
            */
            const topLeft = points.reduce(
                (best, point) =>
                    point.x + point.y <
                    best.x + best.y
                        ? point
                        : best
            );

            const bottomRight = points.reduce(
                (best, point) =>
                    point.x + point.y >
                    best.x + best.y
                        ? point
                        : best
            );

            const topRight = points.reduce(
                (best, point) =>
                    point.x - point.y >
                    best.x - best.y
                        ? point
                        : best
            );

            const bottomLeft = points.reduce(
                (best, point) =>
                    point.x - point.y <
                    best.x - best.y
                        ? point
                        : best
            );

            return [
                topLeft,
                topRight,
                bottomRight,
                bottomLeft
            ];
        }

        function warpReceipt(source, corners) {
            const [
                topLeft,
                topRight,
                bottomRight,
                bottomLeft
            ] = corners;

            const topWidth =
                distance(topLeft, topRight);

            const bottomWidth =
                distance(bottomLeft, bottomRight);

            const leftHeight =
                distance(topLeft, bottomLeft);

            const rightHeight =
                distance(topRight, bottomRight);

            const outputWidth = Math.max(
                1,
                Math.round(
                    Math.max(topWidth, bottomWidth)
                )
            );

            const outputHeight = Math.max(
                1,
                Math.round(
                    Math.max(leftHeight, rightHeight)
                )
            );

            const sourcePoints = cv.matFromArray(
                4,
                1,
                cv.CV_32FC2,
                [
                    topLeft.x,
                    topLeft.y,

                    topRight.x,
                    topRight.y,

                    bottomRight.x,
                    bottomRight.y,

                    bottomLeft.x,
                    bottomLeft.y
                ]
            );

            const destinationPoints = cv.matFromArray(
                4,
                1,
                cv.CV_32FC2,
                [
                    0,
                    0,

                    outputWidth - 1,
                    0,

                    outputWidth - 1,
                    outputHeight - 1,

                    0,
                    outputHeight - 1
                ]
            );

            const transform = cv.getPerspectiveTransform(
                sourcePoints,
                destinationPoints
            );

            const output = new cv.Mat();

            cv.warpPerspective(
                source,
                output,
                transform,
                new cv.Size(outputWidth, outputHeight),
                cv.INTER_CUBIC,
                cv.BORDER_REPLICATE
            );

            sourcePoints.delete();
            destinationPoints.delete();
            transform.delete();

            return output;
        }


        function autoDeskewReceipt(receipt) {
            const gray = new cv.Mat();
            const blurred = new cv.Mat();
            const edges = new cv.Mat();
            const lines = new cv.Mat();

            try {
                cv.cvtColor(
                    receipt,
                    gray,
                    cv.COLOR_RGBA2GRAY
                );

                cv.GaussianBlur(
                    gray,
                    blurred,
                    new cv.Size(3, 3),
                    0
                );

                cv.Canny(
                    blurred,
                    edges,
                    50,
                    150,
                    3,
                    false
                );

                /*
                    Detect long, nearly-horizontal strokes. Receipt text
                    creates many short line segments with a shared angle.
                */
                const minimumLineLength = Math.max(
                    40,
                    Math.round(receipt.cols * 0.08)
                );

                cv.HoughLinesP(
                    edges,
                    lines,
                    1,
                    Math.PI / 180,
                    35,
                    minimumLineLength,
                    12
                );

                const angles = [];

                for (let row = 0; row < lines.rows; row++) {
                    const line = lines.intPtr(row, 0);
                    const x1 = line[0];
                    const y1 = line[1];
                    const x2 = line[2];
                    const y2 = line[3];

                    const deltaX = x2 - x1;
                    const deltaY = y2 - y1;
                    const length = Math.hypot(deltaX, deltaY);

                    if (length < minimumLineLength) {
                        continue;
                    }

                    let angle =
                        Math.atan2(deltaY, deltaX) *
                        180 / Math.PI;

                    /* Normalize equivalent line directions. */
                    while (angle <= -90) angle += 180;
                    while (angle > 90) angle -= 180;

                    /*
                        Ignore receipt borders and strong vertical edges.
                        We only use plausible text-line slopes.
                    */
                    if (angle >= -25 && angle <= 25) {
                        const repeats = Math.max(
                            1,
                            Math.round(length / minimumLineLength)
                        );

                        for (let count = 0; count < repeats; count++) {
                            angles.push(angle);
                        }
                    }
                }

                if (angles.length < 4) {
                    return {
                        image: receipt.clone(),
                        rotationAngle: 0
                    };
                }

                angles.sort((a, b) => a - b);

                const middle = Math.floor(angles.length / 2);
                const detectedAngle =
                    angles.length % 2 === 0
                        ? (angles[middle - 1] + angles[middle]) / 2
                        : angles[middle];

                if (Math.abs(detectedAngle) < 0.2) {
                    return {
                        image: receipt.clone(),
                        rotationAngle: 0
                    };
                }

                const correctionAngle = -detectedAngle;

                return {
                    image: rotateImageKeepingBounds(
                        receipt,
                        correctionAngle
                    ),
                    rotationAngle: correctionAngle
                };
            } finally {
                gray.delete();
                blurred.delete();
                edges.delete();
                lines.delete();
            }
        }

        function rotateImageKeepingBounds(source, angleDegrees) {
            const angleRadians =
                Math.abs(angleDegrees) * Math.PI / 180;

            const cosine = Math.cos(angleRadians);
            const sine = Math.sin(angleRadians);

            const outputWidth = Math.ceil(
                source.cols * cosine +
                source.rows * sine
            );

            const outputHeight = Math.ceil(
                source.rows * cosine +
                source.cols * sine
            );

            const center = new cv.Point(
                source.cols / 2,
                source.rows / 2
            );

            const rotationMatrix =
                cv.getRotationMatrix2D(
                    center,
                    angleDegrees,
                    1
                );

            rotationMatrix.doublePtr(0, 2)[0] +=
                outputWidth / 2 - center.x;

            rotationMatrix.doublePtr(1, 2)[0] +=
                outputHeight / 2 - center.y;

            const rotated = new cv.Mat();

            cv.warpAffine(
                source,
                rotated,
                rotationMatrix,
                new cv.Size(outputWidth, outputHeight),
                cv.INTER_CUBIC,
                cv.BORDER_CONSTANT,
                new cv.Scalar(255, 255, 255, 255)
            );

            rotationMatrix.delete();

            return rotated;
        }

        function cleanReceiptForOcr(receipt) {
            const gray = new cv.Mat();

            cv.cvtColor(
                receipt,
                gray,
                cv.COLOR_RGBA2GRAY
            );

            /*
                Upscaling helps Tesseract with small thermal receipt text.
            */
            let working = gray;

            if (gray.cols < 1400) {
                const scale = 1400 / gray.cols;
                const resized = new cv.Mat();

                cv.resize(
                    gray,
                    resized,
                    new cv.Size(
                        Math.round(gray.cols * scale),
                        Math.round(gray.rows * scale)
                    ),
                    0,
                    0,
                    cv.INTER_CUBIC
                );

                working = resized;
            }

            const denoised = new cv.Mat();

            cv.GaussianBlur(
                working,
                denoised,
                new cv.Size(3, 3),
                0
            );

            const thresholded = new cv.Mat();

            cv.adaptiveThreshold(
                denoised,
                thresholded,
                255,
                cv.ADAPTIVE_THRESH_GAUSSIAN_C,
                cv.THRESH_BINARY,
                31,
                15
            );

            /*
                Add a white margin so characters near the receipt edge
                are not clipped during OCR.
            */
            const bordered = new cv.Mat();

            cv.copyMakeBorder(
                thresholded,
                bordered,
                30,
                30,
                30,
                30,
                cv.BORDER_CONSTANT,
                new cv.Scalar(255, 255, 255, 255)
            );

            gray.delete();

            if (working !== gray) {
                working.delete();
            }

            denoised.delete();
            thresholded.delete();

            return bordered;
        }

        function distance(pointA, pointB) {
            return Math.hypot(
                pointA.x - pointB.x,
                pointA.y - pointB.y
            );
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                const temporaryUrl = URL.createObjectURL(file);

                image.onload = () => {
                    URL.revokeObjectURL(temporaryUrl);
                    resolve(image);
                };

                image.onerror = () => {
                    URL.revokeObjectURL(temporaryUrl);
                    reject(
                        new Error("The selected image could not be loaded.")
                    );
                };

                image.src = temporaryUrl;
            });
        }

        function updateOcrProgress(message) {
            console.log(message);

            const readableStatus =
                formatStatus(message.status);

            if (readableStatus) {
                statusText.textContent = readableStatus;
            }

            if (typeof message.progress === "number") {
                const percentage = Math.round(
                    message.progress * 100
                );

                /*
                    Reserve the beginning of the bar for preprocessing,
                    then use the remaining portion for OCR.
                */
                const displayedPercentage =
                    15 + Math.round(percentage * 0.85);

                progressBar.style.width =
                    `${displayedPercentage}%`;

                if (message.status === "recognizing text") {
                    statusText.textContent =
                        `Recognizing text: ${percentage}%`;
                }
            }
        }

        function formatStatus(status) {
            const statusLabels = {
                "loading tesseract core":
                    "Loading OCR engine...",

                "initializing tesseract":
                    "Initializing OCR...",

                "loading language traineddata":
                    "Loading English language data...",

                "initializing api":
                    "Preparing text recognition...",

                "recognizing text":
                    "Recognizing receipt text..."
            };

            return statusLabels[status] || status || "";
        }

        function setControlsDisabled(disabled) {
            scanButton.disabled =
                disabled || !selectedFile;

            cameraButton.disabled = disabled;
            galleryButton.disabled = disabled;
        }

        function resetResults() {
            recognizedText.value = "";
            confidenceText.textContent = "";
            resultContainer.style.display = "none";
            statusContainer.style.display = "none";
            progressBar.style.width = "0%";
        }

        function clearProcessedPreview() {
            const context =
                processedCanvas.getContext("2d");

            context.clearRect(
                0,
                0,
                processedCanvas.width,
                processedCanvas.height
            );

            processedCanvas.width = 0;
            processedCanvas.height = 0;

            processedPanel.style.display = "none";
            processingNote.style.display = "none";
            processingNote.textContent = "";
        }

        function clearPage() {
            selectedFile = null;

            cameraInput.value = "";
            galleryInput.value = "";

            imagePreview.removeAttribute("src");
            imageSection.style.display = "none";

            if (previewUrl) {
                URL.revokeObjectURL(previewUrl);
                previewUrl = null;
            }

            clearProcessedPreview();
            resetResults();
            clearError();
            setControlsDisabled(false);
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
        }

        function clearError() {
            errorMessage.textContent = "";
            errorMessage.style.display = "none";
        }

        window.addEventListener("beforeunload", () => {
            if (worker) {
                worker.terminate();
            }
        });
    </script>
</body>
